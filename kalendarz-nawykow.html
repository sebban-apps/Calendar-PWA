<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendarz nawyków</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#134C74">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nawyki">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#D7E6F0; --paper-raised:#EEF5FA; --ink:#0E2333; --ink-soft:#42607A;
    --ink-faint:#7C9AAE; --current:#134C74; --current-dim:#7BAECD; --sage:#4E9B72;
    --rust:#B24B4B; --rule:#B6D2E3; --rule-soft:#D6E7F0; --hidden-op:.42;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Fraunces',Georgia,serif;min-height:100vh;display:flex;justify-content:center}
  .page{width:100%;max-width:560px;padding:22px 16px 60px}

  header.top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;text-align:center}
  .ripple-mark{flex-shrink:0}
  .head-text{text-align:left}
  .date-line{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .title{font-size:21px;font-weight:500;margin-top:1px;font-variation-settings:'opsz' 40}

  .card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:4px;padding:20px 16px;margin-bottom:16px}

  .toolbar{display:flex;gap:7px;margin-bottom:0;flex-wrap:wrap;align-items:center}
  .toolbar input[type=text]{flex:1;min-width:130px;margin-bottom:0;padding:9px 11px;font-size:13.5px}
  .icon-btn{background:none;border:1px solid var(--rule);border-radius:4px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:16px}
  .icon-btn.active{border-color:var(--current);color:var(--current)}
  .icon-btn svg{width:16px;height:16px}

  textarea,input[type=text],input[type=date],input[type=time],select{width:100%;font-family:'Fraunces',Georgia,serif;font-size:14.5px;padding:10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);margin-bottom:10px}
  input[type=date],input[type=time],select{font-family:'JetBrains Mono',monospace;font-size:13px}
  textarea{min-height:66px;resize:vertical}
  textarea:focus,input:focus,select:focus,.chip:focus,button:focus{outline:2px solid var(--current);outline-offset:2px}
  .field-label{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;display:block}
  .err{color:var(--rust);font-family:'JetBrains Mono',monospace;font-size:11px;margin:-6px 0 10px;min-height:14px}
  .hint-text{color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-size:10.5px;margin:-2px 0 10px;line-height:1.5}

  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips.left{justify-content:flex-start}
  .chip{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:8px 12px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .chip.active{background:var(--current);border-color:var(--current);color:var(--paper-raised)}
  .chip.add-new{border-style:dashed;color:var(--ink-soft)}
  .chip:disabled{opacity:.4;cursor:default}
  .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  .vis-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .vis-chip{font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;opacity:1}
  .vis-chip.off{opacity:var(--hidden-op)}
  .vis-quick{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--current);background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px 2px}

  .stats-line{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:center;margin:2px 0 14px}
  .stats-line b{color:var(--current);font-weight:600}

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-nav .icon-btn{border:none}
  .cal-month{font-size:16px;font-weight:500}
  .cal-jump-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft)}
  .cal-jump-label{display:flex;align-items:center;gap:7px}
  .cal-jump-row input[type=date]{width:auto;margin:0;padding:6px 8px;font-size:11.5px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-align:center;color:var(--ink-faint);padding-bottom:4px;text-transform:uppercase}
  .cal-cell{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;border-radius:4px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid transparent;color:var(--ink);background:transparent}
  .cal-cell.empty{visibility:hidden;cursor:default}
  .cal-cell.has-entries{background:var(--paper);border-color:var(--rule)}
  .cal-cell.selected{border-color:var(--current);background:var(--current);color:var(--paper-raised)}
  .cal-cell.today-cell{font-weight:700;text-decoration:underline}
  .cal-dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;justify-content:center;max-width:34px}
  .cal-dot{width:5px;height:5px;border-radius:50%}
  .cal-more{font-size:8px;color:var(--ink-faint);margin-top:1px}
  .cal-cell.selected .cal-more{color:var(--paper-raised)}

  .disclosure{margin-top:2px}
  .panel{display:none;margin-top:10px;padding-top:12px;border-top:1px dashed var(--rule)}
  .panel.visible{display:block}
  .row-2{display:flex;gap:10px}
  .row-2>div{flex:1}
  .link-btn{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--current);text-decoration:underline;cursor:pointer;padding:4px}

  .log-heading{font-size:13.5px;color:var(--ink-soft);margin:4px 0 8px;display:flex;align-items:center;gap:10px}
  .log-heading::after{content:'';flex:1;height:1px;background:var(--rule)}

  .add-card{border-left:3px solid var(--current);padding-left:14px}
  .add-heading{font-size:15px;font-weight:500;margin-bottom:2px}
  .add-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}

  .wd-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .wd-chip{font-family:'JetBrains Mono',monospace;font-size:11px;width:33px;height:33px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wd-chip.active{background:var(--current);border-color:var(--current);color:var(--paper-raised)}
  .wd-quick-row{margin-bottom:12px}
  .wd-quick{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--current);background:none;border:none;cursor:pointer;text-decoration:underline;padding:2px 4px}
  .recur-toggle{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;cursor:pointer}
  .recur-toggle input{width:auto;margin:0}

  .entry{padding:12px 0;border-bottom:1px solid var(--rule-soft)}
  .entry:last-child{border-bottom:none}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .entry-meta{display:flex;align-items:baseline;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);margin-bottom:4px;flex-wrap:wrap}
  .entry-tag{font-weight:600}
  .entry-subtitle{font-size:15.5px;font-weight:500;line-height:1.35;margin:1px 0 2px}
  .entry-note{font-size:14px;line-height:1.5;white-space:pre-wrap}
  .entry-actions{display:flex;gap:2px;flex-shrink:0}
  .mini-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--ink-faint)}
  .mini-btn svg{width:15px;height:15px;display:block}
  .mini-btn.starred{color:var(--current)}
  .entry.editing .entry-static,.entry.confirming .entry-static{display:none}
  .empty-log{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);padding:18px 0;line-height:1.6}

  .confirm-box{padding:8px 0}
  .confirm-q{font-size:13.5px;margin-bottom:10px}
  .confirm-actions{display:flex;gap:7px;flex-wrap:wrap}

  button.primary,button.ghost,button.danger{font-family:'Fraunces',Georgia,serif;font-size:14.5px;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid transparent}
  button.primary{background:var(--ink);color:var(--paper-raised)}
  button.ghost{background:transparent;border-color:var(--rule);color:var(--ink)}
  button.danger{background:transparent;border-color:var(--rust);color:var(--rust)}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5;cursor:default}

  .cat-manage-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
  .cat-manage-row:last-child{border-bottom:none}
  .cat-manage-name{flex:1;font-size:14px;display:flex;align-items:center;gap:8px}
  .add-cat-form{display:flex;gap:7px;margin-top:10px}
  .add-cat-form input{margin-bottom:0;flex:1}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <span class="ripple-mark">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="14.5" fill="none" stroke="var(--current-dim)" stroke-width="1.4"/>
        <circle cx="17" cy="17" r="9.5" fill="none" stroke="var(--current)" stroke-width="1.8" opacity=".8"/>
        <circle cx="17" cy="17" r="3" fill="var(--ink)"/>
      </svg>
    </span>
    <span class="head-text">
      <div class="date-line" id="todayLine">—</div>
      <div class="title">Kalendarz nawyków</div>
    </span>
  </header>

  <div class="card">
    <div class="toolbar" style="margin-bottom:14px">
      <input type="text" id="searchInput" data-testid="search" placeholder="szukaj w notatkach…">
      <button class="icon-btn" id="favFilterBtn" data-testid="fav-filter" title="tylko ulubione">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
      </button>
    </div>

    <div class="vis-row" id="visRow" data-testid="vis-row"></div>
    <div style="margin-bottom:12px">
      <button type="button" class="vis-quick" id="visAllBtn" data-testid="vis-all">wszystkie</button>
      <span style="color:var(--rule)"> · </span>
      <button type="button" class="vis-quick" id="visNoneBtn" data-testid="vis-none">żadna</button>
    </div>

    <div class="stats-line" id="statsLine" data-testid="stats-line"></div>

    <div class="cal-nav">
      <button class="icon-btn" id="calPrev" data-testid="cal-prev">‹</button>
      <div class="cal-month" id="calMonthLabel" data-testid="cal-month">—</div>
      <button class="icon-btn" id="calNext" data-testid="cal-next">›</button>
    </div>
    <div class="cal-jump-row">
      <button type="button" class="vis-quick" id="calTodayBtn" data-testid="cal-today">dziś</button>
      <span style="color:var(--rule)">·</span>
      <label class="cal-jump-label">skocz do dnia
        <input type="date" id="calJumpInput" data-testid="cal-jump-input">
      </label>
    </div>
    <div class="cal-grid" id="calGrid" data-testid="cal-grid"></div>
  </div>

  <div class="card" id="resultsCard" data-testid="results-card" style="display:none">
    <div id="resultsPanel" data-testid="results-panel"></div>
  </div>

  <div class="card" id="dayCard" data-testid="day-card">
    <div id="dayPanel" data-testid="day-panel"></div>
  </div>

  <div class="card add-card" id="addCard" data-testid="add-card">
    <div id="addPanel" data-testid="add-panel"></div>
  </div>

  <div class="card">
    <div class="disclosure">
      <button class="link-btn" id="toggleCatMgrBtn" data-testid="toggle-cat-mgr">+ zarządzaj kategoriami</button>
      <div class="panel" id="catMgrPanel" data-testid="cat-mgr-panel"></div>
    </div>
  </div>

  <div class="card">
    <div class="disclosure">
      <button class="link-btn" id="exportBtn" data-testid="export-btn">eksportuj kopię zapasową</button>
      <span style="color:var(--rule)"> · </span>
      <button class="link-btn" id="importBtn" data-testid="import-btn">przywróć z kopii</button>
      <input type="file" id="importFile" data-testid="import-file" accept="application/json,.json" style="display:none">
      <div class="err" id="backupMsg" data-testid="backup-msg"></div>
      <div class="hint-text" id="autoBackupInfo" data-testid="auto-backup-info"></div>
      <div id="liveMirrorRow" data-testid="live-mirror-row" style="display:none;margin-top:6px"></div>
    </div>
  </div>

</div>

<script>
(function () {
'use strict';

/* ---------------- storage (Claude gdy dostępne, w przeciwnym razie localStorage telefonu) ---------------- */
const Store = (function () {
  const real = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? window.storage : null;
  const LS_PREFIX = 'kalendarz-nawykow:';
  let lsWorks = false;
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem(LS_PREFIX + '__test', '1');
      localStorage.removeItem(LS_PREFIX + '__test');
      lsWorks = true;
    }
  } catch (e) { lsWorks = false; }
  const mem = new Map();

  return {
    mode: real ? 'claude' : (lsWorks ? 'local' : 'memory'),
    async get(key) {
      if (real) { try { const r = await real.get(key, false); return (r && r.value) ? r.value : null; } catch (e) { return null; } }
      if (lsWorks) { try { return localStorage.getItem(LS_PREFIX + key); } catch (e) { return mem.has(key) ? mem.get(key) : null; } }
      return mem.has(key) ? mem.get(key) : null;
    },
    async set(key, val) {
      if (real) { try { await real.set(key, val, false); return true; } catch (e) { return false; } }
      if (lsWorks) { try { localStorage.setItem(LS_PREFIX + key, val); return true; } catch (e) { mem.set(key, val); return false; } }
      mem.set(key, val); return true;
    }
  };
})();
async function loadJSON(key, fb) {
  const raw = await Store.get(key);
  if (raw === null || raw === undefined) return fb;
  try { const v = JSON.parse(raw); return (v === null || v === undefined) ? fb : v; } catch (e) { return fb; }
}
/* połączony plik na dysku (File System Access API, tylko wspierające przeglądarki) - jeśli podpięty,
   każda zmiana danych cicho dopisuje się do niego, bez pobierania kolejnych plików */
let liveFileHandle = null;
let liveMirrorTimer = null;
async function writeToHandle(handle, json) {
  const writable = await handle.createWritable();
  await writable.write(json);
  await writable.close();
}
function scheduleLiveMirror() {
  if (!liveFileHandle) return;
  clearTimeout(liveMirrorTimer);
  liveMirrorTimer = setTimeout(async () => {
    try {
      const data = await gatherBackup();
      await writeToHandle(liveFileHandle, JSON.stringify(data, null, 2));
    } catch (e) { liveFileHandle = null; if (typeof renderLiveMirrorRow === 'function') await renderLiveMirrorRow(); }
  }, 800);
}
const saveJSON = (key, val) => { const p = Store.set(key, JSON.stringify(val)); scheduleLiveMirror(); return p; };

const DEFAULT_CATEGORIES = ['plastry', 'witaminy', 'kosmetyki', 'sport'];
const DEFAULT_CAT_COLORS = { 'plastry': '#134C74', 'witaminy': '#D69A44', 'kosmetyki': '#B97BA6', 'sport': '#4E9B72' };
const FALLBACK_PALETTE = ['#3E7CB1', '#6B6FC4', '#4FA8A0', '#8B7EC8', '#5FA3C0', '#9A82B5', '#5C8F6B', '#C4708A'];
const RECURRING_HORIZON_WEEKS = 12;

let categoryColorCache = {};
function colorForCategory(name) {
  if (categoryColorCache[name]) return categoryColorCache[name];
  if (DEFAULT_CAT_COLORS[name]) return DEFAULT_CAT_COLORS[name];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return FALLBACK_PALETTE[h % FALLBACK_PALETTE.length];
}

/* strażnicy typów: chronią przed uszkodzonymi danymi w magazynie */
const asArray = v => Array.isArray(v) ? v : [];
const asPlainObject = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

const loadEntries = async () => asArray(await loadJSON('entries', []))
  .filter(e => e && typeof e === 'object' && e.id !== undefined && typeof e.date === 'string' && DATE_RE.test(e.date) && typeof e.category === 'string');
const saveEntries = e => saveJSON('entries', asArray(e));

const loadCategories = async () => {
  const raw = asArray(await loadJSON('categories', DEFAULT_CATEGORIES))
    .filter(c => typeof c === 'string' && c.trim() !== '');
  return raw.length ? raw : DEFAULT_CATEGORIES.slice();
};
const saveCategories = c => saveJSON('categories', asArray(c));

const loadHidden = async () => asArray(await loadJSON('hiddenCategories', []))
  .filter(c => typeof c === 'string');
const saveHidden = h => saveJSON('hiddenCategories', asArray(h));

const loadSeriesMeta = async () => asPlainObject(await loadJSON('seriesMeta', {}));
const saveSeriesMeta = m => saveJSON('seriesMeta', asPlainObject(m));

const loadCategoryColors = async () => asPlainObject(await loadJSON('categoryColors', {}));
const saveCategoryColors = c => saveJSON('categoryColors', asPlainObject(c));

/* ---------------- narzędzia ---------------- */
const MONTHS_GEN = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
const MONTHS_NOM = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
const MONTHS_ABBR = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];
const DOW = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'So', 'Nd'];
const DAYS_FULL = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
/* poniedziałek..niedziela w kolejności siatki, z wartością getDay() */
const WEEKDAY_OPTIONS = [1, 2, 3, 4, 5, 6, 0];

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => { const d = document.createElement('div'); d.textContent = (s === null || s === undefined) ? '' : String(s); return d.innerHTML; };
const $ = id => document.getElementById(id);
const dateFromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); };

/* walidacje */
function parseClock(raw) {
  const s = String(raw === null || raw === undefined ? '' : raw).trim();
  if (s === '') return { ok: true, value: '' };
  const m = s.match(/^(\d{1,2})[:.](\d{2})$/);
  if (!m) return { ok: false, msg: 'Zły format godziny, wpisz np. 9:00.' };
  const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
  if (h > 23) return { ok: false, msg: 'Godzina od 0 do 23.' };
  if (mi > 59) return { ok: false, msg: 'Minuty od 0 do 59.' };
  return { ok: true, value: `${h}:${pad(mi)}` };
}
function showErr(el, msg) { if (el) el.textContent = msg || ''; }

function makeEntry({ date, time, category, subtitle, note, favorite, seriesId }) {
  return {
    id: Date.now() + Math.floor(Math.random() * 100000),
    date, time: time || '', category,
    subtitle: (subtitle || '').trim(), note: (note || '').trim(),
    favorite: !!favorite, seriesId: (seriesId === undefined ? null : seriesId)
  };
}

/* ---------------- powtarzalne serie ---------------- */
function nextOrSameWeekday(dateObj, weekday) {
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), 12, 0, 0);
  const diff = (weekday - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d;
}
function computeHorizon(fromDate) {
  const d = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate(), 12, 0, 0);
  d.setDate(d.getDate() + RECURRING_HORIZON_WEEKS * 7);
  return d;
}
function occurrencesBetween(anchorDate, horizonDate) {
  const out = [];
  let d = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate(), 12, 0, 0);
  while (d.getTime() <= horizonDate.getTime()) { out.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7, 12, 0, 0); }
  return out;
}

/* recurringWeekdays: null/[] dla wpisu jednorazowego, albo tablica dni tygodnia (wartości getDay()),
   każdy dzień staje się osobną serią (własny seriesId), żeby usuwanie/kończenie jednej serii nie ruszało innych */
async function addEntry({ date, time, category, subtitle, note, recurringWeekdays }) {
  const entries = await loadEntries();
  const days = Array.isArray(recurringWeekdays) ? recurringWeekdays.filter(n => Number.isInteger(n) && n >= 0 && n <= 6) : [];
  if (!days.length) {
    entries.push(makeEntry({ date, time, category, subtitle, note, favorite: false, seriesId: null }));
    await saveEntries(entries);
    return;
  }
  const horizon = computeHorizon(new Date());
  const metas = await loadSeriesMeta();
  days.forEach((weekday, i) => {
    const seriesId = Date.now() + i * 97 + Math.floor(Math.random() * 1000);
    const anchor = nextOrSameWeekday(dateFromYmd(date), weekday);
    const occ = occurrencesBetween(anchor, horizon);
    occ.forEach(d => entries.push(makeEntry({ date: ymd(d), time, category, subtitle, note, favorite: false, seriesId })));
    metas[String(seriesId)] = { category, weekday, time: time || '', generatedUntil: ymd(horizon), endedAt: null };
  });
  await saveEntries(entries);
  await saveSeriesMeta(metas);
}

/* kończy serię od wskazanej daty wzwyż (włącznie) - wcześniejsza historia zostaje bez zmian */
async function endSeriesFrom(seriesId, fromDate, entries, metas) {
  const keep = entries.filter(x => !(x.seriesId === seriesId && x.date >= fromDate));
  const meta = metas[String(seriesId)];
  if (meta) meta.endedAt = fromDate;
  return keep;
}

async function regenerateSeries() {
  const metas = await loadSeriesMeta();
  const ids = Object.keys(metas).filter(id => metas[id] && !metas[id].endedAt);
  if (!ids.length) return;
  const today = new Date();
  const horizon = computeHorizon(today);
  let changed = false;
  const entries = await loadEntries();
  for (const id of ids) {
    const meta = metas[id];
    if (!meta.generatedUntil || !DATE_RE.test(meta.generatedUntil)) continue;
    const genUntil = dateFromYmd(meta.generatedUntil);
    if (horizon.getTime() <= genUntil.getTime()) continue;
    const startFrom = new Date(genUntil.getFullYear(), genUntil.getMonth(), genUntil.getDate() + 1, 12, 0, 0);
    const nextDate = nextOrSameWeekday(startFrom, meta.weekday);
    const occ = occurrencesBetween(nextDate, horizon);
    occ.forEach(d => entries.push(makeEntry({ date: ymd(d), time: meta.time, category: meta.category, note: '', favorite: false, seriesId: Number(id) })));
    meta.generatedUntil = ymd(horizon);
    changed = true;
  }
  if (changed) { await saveEntries(entries); await saveSeriesMeta(metas); }
}

let editingId = null;
let deletingId = null;

async function handleEntryListClick(e, list, afterChange) {
  const btn = e.target.closest('[data-act]');
  if (!btn) {
    const chip = e.target.closest('[data-ecat]');
    if (chip) {
      const row = chip.closest('.edit-tags');
      row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      return;
    }
    if (e.target.classList && e.target.classList.contains('edit-recur-toggle')) {
      editRecurOn = e.target.checked;
      const fields = e.target.closest('.entry-edit').querySelector('.edit-recur-fields');
      if (fields) fields.style.display = editRecurOn ? 'block' : 'none';
      return;
    }
    const wdChip = e.target.closest('.wd-chip[data-wdscope="edit"]');
    if (wdChip) {
      const wd = Number(wdChip.dataset.wd);
      if (editRecurDays.has(wd)) editRecurDays.delete(wd); else editRecurDays.add(wd);
      wdChip.classList.toggle('active');
      return;
    }
    if (e.target.closest('[data-wdall="edit"]')) { WEEKDAY_OPTIONS.forEach(wd => editRecurDays.add(wd)); refreshWeekdayChips(e.currentTarget, 'edit', editRecurDays); return; }
    if (e.target.closest('[data-wdclear="edit"]')) { editRecurDays.clear(); refreshWeekdayChips(e.currentTarget, 'edit', editRecurDays); return; }
    return;
  }
  const id = Number(btn.dataset.id);
  const act = btn.dataset.act;

  if (act === 'fav') {
    const entries = await loadEntries();
    const s = entries.find(x => x.id === id);
    if (s) { s.favorite = !s.favorite; await saveEntries(entries); }
    afterChange(); return;
  }
  if (act === 'edit') {
    editingId = id; deletingId = null;
    const entries = await loadEntries();
    const target = entries.find(x => x.id === id);
    editRecurOn = !!(target && target.seriesId);
    editRecurDays = new Set(target ? [dateFromYmd(target.date).getDay()] : []);
    editRecurOriginalOn = editRecurOn;
    editRecurOriginalDays = new Set(editRecurDays);
    afterChange(); return;
  }
  if (act === 'cancel-edit') { editingId = null; editRecurOn = false; editRecurDays = new Set(); editRecurOriginalOn = false; editRecurOriginalDays = new Set(); afterChange(); return; }
  if (act === 'del') { deletingId = id; editingId = null; afterChange(); return; }
  if (act === 'cancel-del') { deletingId = null; afterChange(); return; }
  if (act === 'confirm-del-one') {
    const entries = (await loadEntries()).filter(x => x.id !== id);
    await saveEntries(entries);
    deletingId = null; afterChange(); await renderCalendar(); return;
  }
  if (act === 'confirm-del-series') {
    const entries = await loadEntries();
    const target = entries.find(x => x.id === id);
    if (target && target.seriesId) {
      const metas = await loadSeriesMeta();
      const keep = await endSeriesFrom(target.seriesId, target.date, entries, metas);
      await saveEntries(keep);
      await saveSeriesMeta(metas);
    }
    deletingId = null; afterChange(); await renderCalendar(); return;
  }
  if (act === 'save-edit') {
    const wrap = e.currentTarget.querySelector(`.entry[data-id="${id}"]`);
    const errEl = wrap.querySelector('.edit-err');
    const tr = parseClock(wrap.querySelector('.edit-time').value);
    if (!tr.ok) { showErr(errEl, tr.msg); return; }
    const catBtn = wrap.querySelector('.edit-tags .chip.active');
    const newCategory = catBtn ? catBtn.dataset.ecat : null;
    const newSubtitle = wrap.querySelector('.edit-subtitle').value.trim();
    const newNote = wrap.querySelector('.edit-note').value.trim();
    const recurToggleEl = wrap.querySelector('.edit-recur-toggle');
    const wantsRecurring = recurToggleEl ? recurToggleEl.checked : false;

    const entries = await loadEntries();
    const s = entries.find(x => x.id === id);
    if (!s) { editingId = null; afterChange(); return; }
    const finalCategory = newCategory || s.category;
    const recurConfigChanged = wantsRecurring !== editRecurOriginalOn || !setsEqual(editRecurDays, editRecurOriginalDays);

    if (!recurConfigChanged) {
      // powtarzalność bez zmian — zwykła edycja pól, nie rusza reszty serii
      s.time = tr.value;
      s.category = finalCategory;
      s.subtitle = newSubtitle;
      s.note = newNote;
      await saveEntries(entries);
    } else if (wantsRecurring) {
      if (!editRecurDays.size) { showErr(errEl, 'Wybierz przynajmniej jeden dzień tygodnia.'); return; }
      let remaining = entries.filter(x => x.id !== id);
      if (s.seriesId) {
        const metas = await loadSeriesMeta();
        remaining = await endSeriesFrom(s.seriesId, s.date, remaining, metas);
        await saveSeriesMeta(metas);
      }
      await saveEntries(remaining);
      await addEntry({ date: s.date, time: tr.value, category: finalCategory, subtitle: newSubtitle, note: newNote, recurringWeekdays: [...editRecurDays] });
    } else if (s.seriesId) {
      // zdejmij to jedno wystąpienie z serii i zakończ serię od tego dnia wzwyż; wcześniejsza historia zostaje
      const metas = await loadSeriesMeta();
      let remaining = entries.filter(x => x.id !== id);
      remaining = await endSeriesFrom(s.seriesId, s.date, remaining, metas);
      await saveSeriesMeta(metas);
      remaining.push(makeEntry({ date: s.date, time: tr.value, category: finalCategory, subtitle: newSubtitle, note: newNote, favorite: s.favorite, seriesId: null }));
      await saveEntries(remaining);
    } else {
      s.time = tr.value;
      s.category = finalCategory;
      s.subtitle = newSubtitle;
      s.note = newNote;
      await saveEntries(entries);
    }
    editingId = null; editRecurOn = false; editRecurDays = new Set();
    afterChange(); await renderCalendar(); return;
  }
}

    return;
  }
  const wdChip = e.target.closest('.wd-chip[data-wdscope="add"]');
  if (wdChip) {
    const wd = Number(wdChip.dataset.wd);
    if (addRecurDays.has(wd)) addRecurDays.delete(wd); else addRecurDays.add(wd);
    wdChip.classList.toggle('active');
    return;
  }
  if (e.target.closest('[data-wdall="add"]')) { WEEKDAY_OPTIONS.forEach(wd => addRecurDays.add(wd)); refreshWeekdayChips(addPanel, 'add', addRecurDays); return; }
  if (e.target.closest('[data-wdclear="add"]')) { addRecurDays.clear(); refreshWeekdayChips(addPanel, 'add', addRecurDays); return; }
});

/* ================= KALENDARZ ================= */
const calGrid = $('calGrid');
$('calPrev').addEventListener('click', () => { CAL.month--; if (CAL.month < 0) { CAL.month = 11; CAL.year--; } renderCalendar(); });
$('calNext').addEventListener('click', () => { CAL.month++; if (CAL.month > 11) { CAL.month = 0; CAL.year++; } renderCalendar(); });

function jumpToDate(dateStr) {
  const d = dateFromYmd(dateStr);
  CAL.year = d.getFullYear(); CAL.month = d.getMonth(); CAL.selected = dateStr;
  editingId = null; deletingId = null;
  renderCalendar();
  if (!searchActive()) renderResultsOrDay();
}
$('calTodayBtn').addEventListener('click', () => { jumpToDate(ymd(new Date())); });
$('calJumpInput').addEventListener('change', () => {
  const v = $('calJumpInput').value;
  if (v && DATE_RE.test(v)) jumpToDate(v);
});

async function renderStats(entries) {
  const [y, m] = [CAL.year, CAL.month];
  const inMonth = entries.filter(s => { const d = dateFromYmd(s.date); return d.getFullYear() === y && d.getMonth() === m && isVisible(s.category); });
  $('statsLine').innerHTML = inMonth.length ? `w tym miesiącu: <b>${inMonth.length}</b> ${inMonth.length === 1 ? 'wpis' : 'wpisów'}` : '';
}

async function renderCalendar() {
  const entries = await loadEntries();
  $('calMonthLabel').textContent = `${MONTHS_NOM[CAL.month]} ${CAL.year}`;

  const byDate = {};
  entries.forEach(s => {
    if (!isVisible(s.category)) return;
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s.category);
  });

  const first = new Date(CAL.year, CAL.month, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(CAL.year, CAL.month + 1, 0).getDate();
  const todayKey = ymd(new Date());

  let html = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < offset; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= days; d++) {
    const key = `${CAL.year}-${pad(CAL.month + 1)}-${pad(d)}`;
    const cats = byDate[key];
    const cls = ['cal-cell'];
    if (cats) cls.push('has-entries');
    if (key === todayKey) cls.push('today-cell');
    if (key === CAL.selected) cls.push('selected');
    let marks = '';
    if (cats) {
      const uniq = [...new Set(cats)];
      const shown = uniq.slice(0, 4);
      marks = `<div class="cal-dots">${shown.map(c => `<div class="cal-dot" style="background:${colorForCategory(c)}"></div>`).join('')}</div>`;
      if (uniq.length > 4) marks += `<div class="cal-more">+${uniq.length - 4}</div>`;
    }
    html += `<div class="${cls.join(' ')}" data-date="${key}"><div>${d}</div>${marks}</div>`;
  }
  calGrid.innerHTML = html;
  const jumpInput = $('calJumpInput');
  if (jumpInput && document.activeElement !== jumpInput) jumpInput.value = CAL.selected || '';
  await renderStats(entries);
}
calGrid.addEventListener('click', e => {
  const cell = e.target.closest('[data-date]');
  if (!cell) return;
  CAL.selected = cell.dataset.date;
  editingId = null; deletingId = null;
  renderCalendar();
  if (!searchActive()) renderResultsOrDay();
});

/* ================= ZARZĄDZANIE KATEGORIAMI ================= */
const catMgrPanel = $('catMgrPanel');
let catPendingDelete = null;
let catDeleteAction = 'delete';
let catSubstitute = null;
let catPendingRename = null;

$('toggleCatMgrBtn').addEventListener('click', async () => {
  const panel = $('catMgrPanel');
  if (panel.classList.contains('visible')) { panel.classList.remove('visible'); }
  else { panel.classList.add('visible'); catPendingDelete = null; catPendingRename = null; await renderCatMgr(); }
});

async function countEntriesFor(cat) {
  const entries = await loadEntries();
  return entries.filter(s => s.category === cat).length;
}

async function renderCatMgr() {
  const cats = await loadCategories();
  let html = '';
  for (const c of cats) {
    if (catPendingRename === c) {
      html += `<div class="cat-manage-row" style="flex-direction:column;align-items:stretch">
        <span class="field-label">Nowa nazwa kategorii</span>
        <input type="text" id="renameCatInput" data-testid="rename-cat-input" value="${esc(c)}">
        <div class="err" id="renameCatErr" data-testid="rename-cat-err"></div>
        <div class="confirm-actions">
          <button class="primary" data-mact="confirm-rename-cat" data-cat="${esc(c)}">Zapisz nazwę</button>
          <button class="ghost" data-mact="cancel-rename-cat">Anuluj</button>
        </div>
      </div>`;
    } else if (catPendingDelete === c) {
      const n = await countEntriesFor(c);
      const others = cats.filter(x => x !== c);
      if (!catSubstitute || !others.includes(catSubstitute)) catSubstitute = others[0] || null;
      html += `<div class="cat-manage-row" style="flex-direction:column;align-items:stretch">
        <div class="confirm-q">${n > 0 ? `Kategoria „${esc(c)}” ma ${n} ${n === 1 ? 'wpis' : 'wpisów'}. Co zrobić z nimi?` : `Usunąć pustą kategorię „${esc(c)}”?`}</div>
        ${n > 0 ? `
        <label style="display:flex;gap:8px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-bottom:6px">
          <input type="radio" name="catDelAction" value="delete" ${catDeleteAction === 'delete' ? 'checked' : ''} style="width:auto"> usuń też te wpisy
        </label>
        <label style="display:flex;gap:8px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-bottom:8px">
          <input type="radio" name="catDelAction" value="reassign" ${catDeleteAction === 'reassign' ? 'checked' : ''} style="width:auto" ${!others.length ? 'disabled' : ''}> przenieś do:
          <select id="catSubSelect" style="width:auto;margin:0" ${!others.length ? 'disabled' : ''}>${others.map(o => `<option value="${esc(o)}" ${o === catSubstitute ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
        </label>` : ''}
        <div class="confirm-actions">
          <button class="danger" data-mact="confirm-del-cat" data-cat="${esc(c)}">Usuń kategorię</button>
          <button class="ghost" data-mact="cancel-del-cat">Anuluj</button>
        </div>
      </div>`;
    } else {
      html += `<div class="cat-manage-row">
        <div class="cat-manage-name"><span class="cat-dot" style="background:${colorForCategory(c)}"></span>${esc(c)}</div>
        <button class="mini-btn" data-mact="rename-cat" data-cat="${esc(c)}" title="zmień nazwę">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="mini-btn" data-mact="del-cat" data-cat="${esc(c)}" title="usuń kategorię">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>`;
    }
  }
  html += `<div class="add-cat-form">
    <input type="text" id="newCatInput" data-testid="new-cat-input" placeholder="nowa kategoria">
    <button class="ghost" id="newCatBtn" data-testid="new-cat-btn">Dodaj</button>
  </div>
  <div class="err" id="catMgrErr" data-testid="cat-mgr-err"></div>`;
  catMgrPanel.innerHTML = html;
}

catMgrPanel.addEventListener('change', e => {
  if (e.target.name === 'catDelAction') { catDeleteAction = e.target.value; renderCatMgr(); }
  if (e.target.id === 'catSubSelect') { catSubstitute = e.target.value; }
});

catMgrPanel.addEventListener('click', async e => {
  const btn = e.target.closest('[data-mact]');
  if (btn) {
    const act = btn.dataset.mact;
    if (act === 'rename-cat') { catPendingRename = btn.dataset.cat; catPendingDelete = null; await renderCatMgr(); return; }
    if (act === 'cancel-rename-cat') { catPendingRename = null; await renderCatMgr(); return; }
    if (act === 'confirm-rename-cat') {
      const oldName = btn.dataset.cat;
      const input = $('renameCatInput');
      const newName = (input.value || '').trim();
      if (!newName) { showErr($('renameCatErr'), 'Podaj nazwę kategorii.'); return; }
      if (newName !== oldName) {
        const cats = await loadCategories();
        if (cats.includes(newName)) { showErr($('renameCatErr'), 'Taka kategoria już istnieje.'); return; }
        await renameCategory(oldName, newName);
      }
      catPendingRename = null;
      await renderCatMgr();
      await renderAll();
      return;
    }
    if (act === 'del-cat') { catPendingDelete = btn.dataset.cat; catPendingRename = null; catDeleteAction = 'delete'; catSubstitute = null; await renderCatMgr(); return; }
    if (act === 'cancel-del-cat') { catPendingDelete = null; await renderCatMgr(); return; }
    if (act === 'confirm-del-cat') {
      const name = btn.dataset.cat;
      const n = await countEntriesFor(name);
      await deleteCategory(name, n > 0 ? catDeleteAction : 'delete', catSubstitute);
      catPendingDelete = null;
      await renderCatMgr();
      await renderAll();
      return;
    }
    return;
  }
  if (e.target.id === 'newCatBtn' || e.target.closest('#newCatBtn')) {
    const input = $('newCatInput');
    const name = (input.value || '').trim();
    if (!name) { showErr($('catMgrErr'), 'Podaj nazwę kategorii.'); return; }
    const cats = await loadCategories();
    if (cats.includes(name)) { showErr($('catMgrErr'), 'Taka kategoria już istnieje.'); return; }
    showErr($('catMgrErr'), '');
    cats.push(name);
    await saveCategories(cats);
    await renderCatMgr();
    await renderAll();
  }
});

async function renameCategory(oldName, newName) {
  const cats = await loadCategories();
  const idx = cats.indexOf(oldName);
  if (idx === -1) return;
  const resolvedColor = colorForCategory(oldName);
  cats[idx] = newName;
  await saveCategories(cats);

  const colors = await loadCategoryColors();
  delete colors[oldName];
  colors[newName] = resolvedColor;
  await saveCategoryColors(colors);
  categoryColorCache = colors;

  const entries = await loadEntries();
  entries.forEach(e => { if (e.category === oldName) e.category = newName; });
  await saveEntries(entries);

  const metas = await loadSeriesMeta();
  Object.keys(metas).forEach(id => { if (metas[id] && metas[id].category === oldName) metas[id].category = newName; });
  await saveSeriesMeta(metas);

  hiddenCats = hiddenCats.map(c => c === oldName ? newName : c);
  await saveHidden(hiddenCats);
}

async function deleteCategory(name, action, substitute) {
  const cats = (await loadCategories()).filter(c => c !== name);
  await saveCategories(cats.length ? cats : DEFAULT_CATEGORIES.slice());

  const entries = await loadEntries();
  const metas = await loadSeriesMeta();
  let newEntries;
  const today = ymd(new Date());

  if (action === 'reassign' && substitute) {
    newEntries = entries.map(e => e.category === name ? { ...e, category: substitute } : e);
    Object.keys(metas).forEach(id => { if (metas[id] && metas[id].category === name) metas[id].category = substitute; });
  } else {
    newEntries = entries.filter(e => e.category !== name);
    Object.keys(metas).forEach(id => { if (metas[id] && metas[id].category === name && !metas[id].endedAt) metas[id].endedAt = today; });
  }
  await saveEntries(newEntries);
  await saveSeriesMeta(metas);
  hiddenCats = hiddenCats.filter(c => c !== name);
  await saveHidden(hiddenCats);
}

/* ---------------- kopia zapasowa: eksport / import ---------------- */
const BACKUP_VERSION = 1;
const backupMsg = $('backupMsg');
const autoBackupInfo = $('autoBackupInfo');
const liveMirrorRow = $('liveMirrorRow');
const AUTO_BACKUP_INTERVAL_DAYS = 7;
const supportsFileHandle = typeof window.showSaveFilePicker === 'function';
const daysBetween = (a, b) => Math.floor((b - a) / 86400000);

async function gatherBackup() {
  const [entries, categories, seriesMeta, hidden, catColors] = await Promise.all([
    loadEntries(), loadCategories(), loadSeriesMeta(), loadHidden(), loadCategoryColors()
  ]);
  return { app: 'kalendarz-nawykow', version: BACKUP_VERSION, exportedAt: new Date().toISOString(), entries, categories, seriesMeta, hiddenCategories: hidden, categoryColors: catColors };
}

function sanitizeBackupPayload(data) {
  if (!data || typeof data !== 'object') throw new Error('To nie jest plik kopii zapasowej.');
  const entries = asArray(data.entries)
    .filter(e => e && typeof e === 'object' && typeof e.date === 'string' && DATE_RE.test(e.date) && typeof e.category === 'string' && e.category.trim() !== '')
    .map((e, i) => ({
      id: (typeof e.id === 'number' && Number.isFinite(e.id)) ? e.id : (Date.now() + i * 13 + Math.floor(Math.random() * 1000)),
      date: e.date,
      time: (typeof e.time === 'string' && parseClock(e.time).ok) ? parseClock(e.time).value : '',
      category: String(e.category).trim(),
      subtitle: typeof e.subtitle === 'string' ? e.subtitle : '',
      note: typeof e.note === 'string' ? e.note : '',
      favorite: !!e.favorite,
      seriesId: (typeof e.seriesId === 'number') ? e.seriesId : null
    }));
  const categories = asArray(data.categories).filter(c => typeof c === 'string' && c.trim() !== '');
  const metaRaw = asPlainObject(data.seriesMeta);
  const seriesMeta = {};
  Object.keys(metaRaw).forEach(id => {
    const m = metaRaw[id];
    if (!m || typeof m !== 'object') return;
    if (typeof m.category !== 'string' || m.category.trim() === '') return;
    if (typeof m.weekday !== 'number' || m.weekday < 0 || m.weekday > 6) return;
    if (typeof m.generatedUntil !== 'string' || !DATE_RE.test(m.generatedUntil)) return;
    seriesMeta[id] = {
      category: m.category, weekday: m.weekday,
      time: (typeof m.time === 'string' && parseClock(m.time).ok) ? parseClock(m.time).value : '',
      generatedUntil: m.generatedUntil,
      endedAt: (typeof m.endedAt === 'string' && DATE_RE.test(m.endedAt)) ? m.endedAt : null
    };
  });
  const hiddenCategories = asArray(data.hiddenCategories).filter(c => typeof c === 'string');
  const colorsRaw = asPlainObject(data.categoryColors);
  const categoryColors = {};
  Object.keys(colorsRaw).forEach(name => {
    if (typeof colorsRaw[name] === 'string' && /^#[0-9a-fA-F]{6}$/.test(colorsRaw[name])) categoryColors[name] = colorsRaw[name];
  });
  return {
    entries,
    categories: categories.length ? categories : DEFAULT_CATEGORIES.slice(),
    seriesMeta,
    hiddenCategories,
    categoryColors
  };
}

async function writeBackupToDisk(data, { silent } = {}) {
  const json = JSON.stringify(data, null, 2);
  const filename = `nawyki-kopia-${ymd(new Date())}.json`;

  if (liveFileHandle) {
    try {
      await writeToHandle(liveFileHandle, json);
      if (!silent) { backupMsg.style.color = 'var(--sage)'; backupMsg.textContent = `Zapisano do połączonego pliku: ${liveFileHandle.name}`; }
      return true;
    } catch (e) { liveFileHandle = null; await renderLiveMirrorRow(); /* spadnij do zwykłego pobrania poniżej */ }
  }

  try {
    if (typeof Blob === 'undefined') return false;
    const blob = new Blob([json], { type: 'application/json' });
    if (!silent && typeof navigator !== 'undefined' && navigator.share && navigator.canShare && typeof File !== 'undefined') {
      const file = new File([blob], filename, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Kopia zapasowa: Kalendarz nawyków' }); backupMsg.textContent = 'Wysłano do udostępnienia.'; backupMsg.style.color = 'var(--sage)'; return true; }
        catch (shareErr) { /* anulowane albo niedostępne, spróbuj pobrania */ }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    if (!silent) { backupMsg.style.color = 'var(--sage)'; backupMsg.textContent = `Pobrano: ${filename}`; }
    return true;
  } catch (e) {
    if (!silent) { backupMsg.style.color = 'var(--rust)'; backupMsg.textContent = 'Nie udało się wyeksportować pliku.'; }
    return false;
  }
}

$('exportBtn').addEventListener('click', async () => {
  showErr(backupMsg, '');
  const data = await gatherBackup();
  const ok = await writeBackupToDisk(data, { silent: false });
  if (ok) { await Store.set('lastAutoBackup', ymd(new Date())); await renderAutoBackupInfo(); }
});

/* automatyczna, cykliczna kopia zapasowa - bez klikania, bez gita, zawsze coś leży na dysku */
async function renderAutoBackupInfo() {
  try {
    const last = await Store.get('lastAutoBackup');
    if (!last) { autoBackupInfo.textContent = 'automatyczna kopia: jeszcze żadnej — zapisze się przy pierwszej okazji'; return; }
    const days = daysBetween(dateFromYmd(last), new Date());
    autoBackupInfo.textContent = days <= 0 ? 'automatyczna kopia: dzisiaj' : `automatyczna kopia: ${days} ${days === 1 ? 'dzień' : 'dni'} temu`;
  } catch (e) { /* nieistotne dla działania appki */ }
}
async function maybeAutoBackup() {
  try {
    const last = await Store.get('lastAutoBackup');
    const today = new Date();
    if (last) {
      const days = daysBetween(dateFromYmd(last), today);
      if (days < AUTO_BACKUP_INTERVAL_DAYS) return;
    }
    const data = await gatherBackup();
    if (!data.entries.length && !last) return; // nie ma jeszcze czego zapisywać
    const ok = await writeBackupToDisk(data, { silent: true });
    if (ok) await Store.set('lastAutoBackup', ymd(today));
  } catch (e) { /* cichy backup nie może wywrócić appki */ }
}

/* opcjonalnie: podpięcie pliku na dysku, żeby appka pisała do niego na bieżąco (Chrome/Edge na komputerze) */
async function renderLiveMirrorRow() {
  if (!supportsFileHandle) { liveMirrorRow.style.display = 'none'; return; }
  liveMirrorRow.style.display = 'block';
  if (liveFileHandle) {
    liveMirrorRow.innerHTML = `<span class="hint-text">🔗 na bieżąco zapisuje do „${esc(liveFileHandle.name)}” (do zamknięcia karty)</span> <button type="button" class="link-btn" id="unlinkFileBtn" data-testid="unlink-file-btn">odłącz</button>`;
    $('unlinkFileBtn').addEventListener('click', async () => { liveFileHandle = null; await renderLiveMirrorRow(); });
  } else {
    liveMirrorRow.innerHTML = `<button type="button" class="link-btn" id="linkFileBtn" data-testid="link-file-btn">połącz z plikiem na dysku (na tę kartę)</button>`;
    $('linkFileBtn').addEventListener('click', async () => {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: 'nawyki-kopia.json', types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
        liveFileHandle = handle;
        const data = await gatherBackup();
        await writeToHandle(liveFileHandle, JSON.stringify(data, null, 2));
        await renderLiveMirrorRow();
      } catch (e) { /* użytkownik anulował wybór pliku */ }
    });
  }
}

$('importBtn').addEventListener('click', () => {
  showErr(backupMsg, '');
  $('importFile').click();
});

$('importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!confirm('To zastąpi obecne dane danymi z pliku. Kontynuować?')) return;
  try {
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch (e2) { throw new Error('Plik nie jest poprawnym JSON.'); }
    const clean = sanitizeBackupPayload(parsed);
    await saveEntries(clean.entries);
    await saveCategories(clean.categories);
    await saveSeriesMeta(clean.seriesMeta);
    await saveHidden(clean.hiddenCategories);
    await saveCategoryColors(clean.categoryColors);
    categoryColorCache = clean.categoryColors;
    hiddenCats = clean.hiddenCategories.slice();
    backupMsg.style.color = 'var(--sage)';
    backupMsg.textContent = `Przywrócono ${clean.entries.length} ${clean.entries.length === 1 ? 'wpis' : 'wpisów'}.`;
    await renderAll();
  } catch (err) {
    backupMsg.style.color = 'var(--rust)';
    backupMsg.textContent = err.message || 'Nie udało się wczytać pliku.';
  }
});

/* ---------------- render zbiorczy ---------------- */
async function renderAll() {
  await renderVisRow();
  await renderCalendar();
  await renderResultsOrDay();
}

/* ---------------- start ---------------- */
(async function init() {
  hiddenCats = await loadHidden();
  categoryColorCache = await loadCategoryColors();
  await regenerateSeries();
  await renderAll();
  await renderLiveMirrorRow();
  await maybeAutoBackup();
  await renderAutoBackupInfo();
  window.__appReady = true;
})();

})();
</script>
